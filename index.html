<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لعبة التحدي والبالونات للأطفال</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #d8eeff 0%, #edf7ff 100%);
      --card-bg: #ffffff;
      --card-border: #bce0fd;
      --text-color: #222222;
      --divider-color: #bee3f8;
      --string-color: #a0aec0;
    }

    body.dark-mode {
      --bg-gradient: linear-gradient(180deg, #121824 0%, #1a202c 100%);
      --card-bg: #1e2638;
      --card-border: #2d3748;
      --text-color: #edf2f7;
      --divider-color: #4a5568;
      --string-color: #718096;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      color: var(--text-color);
      transition: background 0.3s;
      overflow: hidden;
    }

    .game-wrapper {
      width: 100%;
      max-width: 440px;
      height: 94vh;
      max-height: 860px;
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    .screen {
      position: absolute;
      inset: 0;
      background: var(--card-bg);
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .screen.hidden {
      display: none !important;
    }

    .screen h2 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #27ae60;
    }

    .input-field {
      width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      border: 2px solid #3498db;
      font-size: 17px;
      margin: 10px 0;
      outline: none;
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      color: #222;
    }

    .input-field:focus {
      border-color: #27ae60;
    }

    .setting-group {
      margin: 8px 0;
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 15px;
    }

    .btn {
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px 26px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 6px 4px;
      box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-secondary {
      background: #3498db;
      box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
    }

    .top-controls {
      display: flex;
      gap: 6px;
      padding: 14px 10px 4px;
      z-index: 10;
    }

    .level-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 16px;
      border: 2px solid #27ae60;
      background: transparent;
      color: #27ae60;
      cursor: pointer;
      text-align: center;
    }

    .level-btn.active {
      background: #27ae60;
      color: white;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px;
      font-weight: bold;
      font-size: 14px;
      z-index: 10;
    }

    .stat-pill {
      background: rgba(0, 0, 0, 0.05);
      padding: 6px 12px;
      border-radius: 14px;
    }

    body.dark-mode .stat-pill {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-skip {
      background: #f39c12;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .hearts {
      color: #e74c3c;
      letter-spacing: 2px;
      font-size: 16px;
    }

    .image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 14px 10px;
      z-index: 10;
      background: var(--card-bg);
      min-height: 180px;
    }

    .question-img {
      width: 230px;
      height: 160px;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
      border: 3px solid rgba(255, 255, 255, 0.85);
      background: #ffffff;
      padding: 4px;
    }

    .dashed-divider {
      border-bottom: 2px dashed var(--divider-color);
      width: 100%;
      z-index: 10;
    }

    .balloons-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .balloon-wrapper {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      will-change: transform;
      touch-action: manipulation;
    }

    .balloon {
      width: 95px;
      height: 115px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      box-shadow: inset -6px -6px 12px rgba(0,0,0,0.25), 0 8px 16px rgba(0,0,0,0.2);
      position: relative;
      text-align: center;
      padding: 6px;
      transition: transform 0.15s ease;
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 6px solid inherit;
    }

    .balloon-string {
      width: 2px;
      height: 30px;
      background: var(--string-color);
    }

    .share-container {
      display: flex;
      gap: 12px;
      margin: 12px 0;
    }

    .share-btn {
      padding: 9px 18px;
      border-radius: 14px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .share-wa { background: #25D366; }
    .share-fb { background: #1877F2; }

    .advice-card {
      background: rgba(39, 174, 96, 0.12);
      border-right: 4px solid #27ae60;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 16px;
      margin: 14px 0;
      line-height: 1.6;
      max-width: 90%;
    }
  </style>
</head>
<body>

<div class="game-wrapper">

  <!-- شاشة البداية -->
  <div id="start-screen" class="screen">
    <h2>🎈 مرحباً يا بطل! 🎈</h2>
    <p style="font-size: 15px; margin-bottom: 10px;">سجل اسمك واستعد لتحدي البالونات</p>
    
    <input type="text" id="player-name-input" class="input-field" placeholder="اكتب اسمك هنا..." value="البطل" onfocus="this.value=''">
    
    <div class="setting-group">
      <span>سرعة الصعود:</span>
      <select id="speed-select" class="input-field" style="width: auto; padding: 6px 10px; margin: 0;">
        <option value="slow">بطيئة 🐢</option>
        <option value="medium" selected>متوسطة 🚶</option>
        <option value="fast">سريعة 🚀</option>
      </select>
    </div>

    <div class="setting-group">
      <span>المظهر:</span>
      <select id="theme-select" class="input-field" style="width: auto; padding: 6px 10px; margin: 0;">
        <option value="dark" selected>داكن (ليلي) 🌙</option>
        <option value="light">أبيض (نهاري) ☀️</option>
      </select>
    </div>

    <button class="btn" style="margin-top: 14px;" onclick="showPreGameAdvice()">ابدأ اللعب الآن! 🚀</button>
  </div>

  <!-- شاشة النصيحة التربوية -->
  <div id="pregame-screen" class="screen hidden">
    <h2 style="color: #f39c12;">💡 قبل ما تلعب متنساش...</h2>
    <div class="advice-card" id="pregame-advice-text"></div>
    <button class="btn" style="margin-top: 16px; font-size: 18px;" onclick="startGameplay()">انطلق للمغامرة! 🎮</button>
  </div>

  <!-- شاشة النهاية -->
  <div id="end-screen" class="screen hidden">
    <h2 id="end-title">أحسنت صنعاً! 🎉</h2>
    <p id="end-message" style="font-size: 16px; margin: 8px 0; font-weight: bold;"></p>
    <div style="font-size: 24px; font-weight: bold; color: #f39c12; margin-bottom: 8px;">
      مجموع النقاط: <span id="final-score">0</span> ⭐️
    </div>

    <div class="share-container">
      <button class="share-btn share-wa" onclick="shareWhatsApp()">واتساب 🟢</button>
      <button class="share-btn share-fb" onclick="shareFacebook()">فيسبوك 🔵</button>
    </div>

    <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px; width: 85%;">
      <button id="next-lvl-btn" class="btn btn-secondary" onclick="goToNextLevel()">المستوى التالي 🌟</button>
      <button class="btn" onclick="restartRound()">إعادة المحاولة 🔄</button>
      <button class="btn" style="background: #7f8c8d;" onclick="resetEntireGame()">البدء من جديد 🏠</button>
    </div>
  </div>

  <!-- التحكم في المستويات الثلاثة -->
  <div class="top-controls">
    <button id="lvl-1-btn" class="level-btn active" onclick="changeLevel(1)">1: حيوانات</button>
    <button id="lvl-2-btn" class="level-btn" onclick="changeLevel(2)">2: أشياء</button>
    <button id="lvl-3-btn" class="level-btn" onclick="changeLevel(3)">3: حشرات</button>
  </div>

  <!-- شريط الإحصائيات -->
  <div class="stats-bar">
    <div class="hearts" id="hearts-display">❤️❤️❤️</div>
    <div class="stat-pill">👤 <span id="player-display">البطل</span></div>
    <div class="stat-pill"><span id="score-display">0</span> ⭐️</div>
    <button class="btn-skip" id="skip-btn" onclick="skipQuestion()">تخطي (<span id="skips-left">3</span>)</button>
  </div>

  <!-- صورة السؤال مع التعامل مع الامتدادات -->
  <div class="image-container">
    <img id="current-image" class="question-img" src="" alt="صورة السؤال" onerror="fixImageExtension(this)">
  </div>

  <div class="dashed-divider"></div>

  <!-- منطقة البالونات -->
  <div class="balloons-area" id="balloons-container"></div>

</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playTone(freq, type, duration) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function playCorrectSound() {
    playTone(523.25, 'sine', 0.15);
    setTimeout(() => playTone(659.25, 'sine', 0.2), 120);
    setTimeout(() => playTone(783.99, 'sine', 0.3), 240);
  }

  function playWrongSound() {
    playTone(220, 'sawtooth', 0.2);
    setTimeout(() => playTone(180, 'sawtooth', 0.3), 150);
  }

  function playBonusSound() {
    playTone(440, 'triangle', 0.1);
    setTimeout(() => playTone(660, 'triangle', 0.1), 100);
    setTimeout(() => playTone(880, 'triangle', 0.25), 200);
  }

  const religiousAdvices = [
    "أن تبدأ بـ «بسم الله الرحمن الرحيم»، فكل عمل يبدأ بذكر الله تحل فيه البركة.",
    "أن تحافظ على صلواتك الخمس في وقتها، فهي صلتك الجميلة بالله تعالى ونور يومك.",
    "أن تطيع والديك وتبتسم في وجههما وتسمع كلامهما لتنال رضا الله وجنته.",
    "أن تجعل لسانك رطباً دائماً بذكر الله، والحمد لله على كل نعمه العظيمة.",
    "أن تكون صادقاً وأميناً دائماً، فالرسول ﷺ كان يُلقب بالصادق الأمين.",
    "أن تخصص وقتاً يومياً لقراءة آيات من القرآن الكريم وحفظها لتنير قلبك.",
    "أن تحب الخير لأصدقائك كما تحبه لنفسك وتساعد من يحتاج لمساعدتك."
  ];

  // 1. مجلد الحيوانات والطيور
  const animalsNames = [
    "أرنب", "أسد", "باندا", "بطة", "بقرة", "بومة", "ثعبان", "جمل", "حصان", 
    "حمار وحشي", "حمامة", "دجاجة", "زرافة", "سلحفاة", "طاووس", "قطة", "كنغر", "نسر", "نعامة", "نمر"
  ];

  // 2. مجلد الأشياء
  const objectsNames = [
    "باب", "ثلاجة", "دراجة", "ساعة", "سجادة", "سرير", "سيارة", "شاشة", "شماعة", "شنطة", 
    "طائرة", "غسالة", "قبعة", "قلم", "كتاب", "كرة", "كرسي", "كوب", "مرآة", "مسجد", "مظلة", "مفتاح", "ملعقة", "نظارة"
  ];

  // 3. مجلد الحشرات
  const insectsNames = [
    "دعسوقة", "ذبابة", "صرصور", "عنكبوت", "فراشة", "ناموس", "نحلة", "نملة"
  ];

  const animalsList = animalsNames.map(name => ({ name, img: `animals/${encodeURIComponent(name)}.JPG` }));
  const objectsList = objectsNames.map(name => ({ name, img: `objects/${encodeURIComponent(name)}.JPG` }));
  const insectsList = insectsNames.map(name => ({ name, img: `insects/${encodeURIComponent(name)}.JPG` }));

  function fixImageExtension(img) {
    if (img.src.endsWith('.JPG')) {
      img.src = img.src.replace('.JPG', '.jpg');
    } else if (img.src.endsWith('.jpg')) {
      img.src = img.src.replace('.jpg', '.png');
    }
  }

  const balloonColors = [
    "#e8175d", "#1e88e5", "#8e24aa", "#00897b", 
    "#f39c12", "#43a047", "#d81b60", "#3949ab", "#d35400"
  ];

  let playerName = "البطل";
  let currentLevel = 1;
  let score = 0;
  let hearts = 3;
  let skips = 3;
  let consecutiveCorrect = 0;
  let currentRoundQuestions = [];
  let currentQuestionIndex = 0;
  let animationDuration = 7000;
  let activeAnimFrame = null;
  let questionStartTime = 0;
  let isAnsweringLocked = false;

  function shuffle(arr) {
    return arr.slice().sort(() => Math.random() - 0.5);
  }

  function showPreGameAdvice() {
    const nameInput = document.getElementById('player-name-input').value.trim();
    playerName = nameInput || "البطل";
    document.getElementById('player-display').innerText = playerName;

    const speed = document.getElementById('speed-select').value;
    if(speed === 'slow') animationDuration = 9500;
    else if(speed === 'fast') animationDuration = 4800;
    else animationDuration = 7000;

    const theme = document.getElementById('theme-select').value;
    if(theme === 'dark') document.body.classList.add('dark-mode');
    else document.body.classList.remove('dark-mode');

    document.getElementById('pregame-advice-text').innerText = shuffle(religiousAdvices)[0];
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('pregame-screen').classList.remove('hidden');
  }

  function startGameplay() {
    document.getElementById('pregame-screen').classList.add('hidden');
    initRound();
  }

  function changeLevel(lvl) {
    currentLevel = lvl;
    document.getElementById('lvl-1-btn').classList.toggle('active', lvl === 1);
    document.getElementById('lvl-2-btn').classList.toggle('active', lvl === 2);
    document.getElementById('lvl-3-btn').classList.toggle('active', lvl === 3);
    initRound();
  }

  function goToNextLevel() {
    const nextLvl = currentLevel < 3 ? currentLevel + 1 : 1;
    changeLevel(nextLvl);
  }

  function getCurrentPool() {
    if (currentLevel === 1) return animalsList;
    if (currentLevel === 2) return objectsList;
    return insectsList;
  }

  function initRound() {
    cancelAnimationFrame(activeAnimFrame);
    score = 0;
    hearts = 3;
    skips = 3;
    consecutiveCorrect = 0;
    currentQuestionIndex = 0;

    const pool = getCurrentPool();
    currentRoundQuestions = shuffle(pool).slice(0, 8);

    updateStats();
    document.getElementById('end-screen').classList.add('hidden');
    loadQuestion();
  }

  function restartRound() {
    initRound();
  }

  function resetEntireGame() {
    cancelAnimationFrame(activeAnimFrame);
    document.getElementById('end-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
  }

  function updateStats() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('hearts-display').innerText = "❤️".repeat(Math.max(0, hearts));
    document.getElementById('skips-left').innerText = skips;
    document.getElementById('skip-btn').style.opacity = skips > 0 ? "1" : "0.5";
  }

  function loadQuestion() {
    cancelAnimationFrame(activeAnimFrame);
    isAnsweringLocked = false;

    if(currentQuestionIndex >= currentRoundQuestions.length || hearts <= 0) {
      endGame();
      return;
    }

    const currentItem = currentRoundQuestions[currentQuestionIndex];
    const imgEl = document.getElementById('current-image');
    imgEl.src = currentItem.img;

    const pool = getCurrentPool();
    const wrongChoices = shuffle(pool.filter(i => i.name !== currentItem.name)).slice(0, 2);
    const options = shuffle([currentItem, ...wrongChoices]);

    const shuffledColors = shuffle(balloonColors).slice(0, 3);
    const container = document.getElementById('balloons-container');
    container.innerHTML = "";

    const xOffsets = ["8%", "39%", "70%"];
    const balloonElements = [];

    options.forEach((opt, idx) => {
      const bColor = shuffledColors[idx];
      const wrapper = document.createElement('div');
      wrapper.className = 'balloon-wrapper';
      wrapper.style.left = xOffsets[idx];

      wrapper.innerHTML = `
        <div class="balloon" style="background: ${bColor}; border-bottom-color: ${bColor};">
          ${opt.name}
        </div>
        <div class="balloon-string"></div>
      `;

      wrapper.onpointerdown = (e) => {
        e.preventDefault();
        handleChoice(opt.name === currentItem.name, wrapper);
      };

      container.appendChild(wrapper);
      balloonElements.push(wrapper);
    });

    const containerH = container.clientHeight || 350;
    const startY = containerH + 10;
    const endY = -150;

    questionStartTime = performance.now();

    function step(timestamp) {
      const elapsed = timestamp - questionStartTime;
      const progress = Math.min(elapsed / animationDuration, 1);
      const currentY = startY - progress * (startY - endY);

      balloonElements.forEach(el => {
        el.style.transform = `translateY(${currentY}px)`;
      });

      if (progress < 1) {
        activeAnimFrame = requestAnimationFrame(step);
      } else {
        if (!isAnsweringLocked) {
          isAnsweringLocked = true;
          playWrongSound();
          consecutiveCorrect = 0;
          hearts--;
          updateStats();
          if (hearts <= 0) {
            setTimeout(endGame, 400);
          } else {
            setTimeout(nextQuestion, 400);
          }
        }
      }
    }

    activeAnimFrame = requestAnimationFrame(step);
  }

  function handleChoice(isCorrect, element) {
    if (isAnsweringLocked) return;
    isAnsweringLocked = true;
    cancelAnimationFrame(activeAnimFrame);

    if (isCorrect) {
      playCorrectSound();
      score += 10;
      consecutiveCorrect++;
      if (consecutiveCorrect % 4 === 0) {
        hearts = Math.min(hearts + 1, 5);
        playBonusSound();
      }
      element.querySelector('.balloon').style.transform = "scale(1.2)";
      setTimeout(nextQuestion, 350);
    } else {
      playWrongSound();
      consecutiveCorrect = 0;
      hearts--;
      element.querySelector('.balloon').style.transform = "scale(0.8)";
      updateStats();

      if (hearts <= 0) {
        setTimeout(endGame, 500);
      } else {
        setTimeout(nextQuestion, 500);
      }
    }
    updateStats();
  }

  function skipQuestion() {
    if (skips > 0 && !isAnsweringLocked) {
      skips--;
      updateStats();
      nextQuestion();
    }
  }

  function nextQuestion() {
    currentQuestionIndex++;
    loadQuestion();
  }

  function endGame() {
    cancelAnimationFrame(activeAnimFrame);
    const isWin = hearts > 0;
    const endScreen = document.getElementById('end-screen');
    const title = document.getElementById('end-title');
    const msg = document.getElementById('end-message');
    const nextBtn = document.getElementById('next-lvl-btn');

    title.innerText = isWin ? "رائع وممتاز يا بطل! 🌟" : "حاول مجدداً يا بطل! 💪";
    msg.innerText = isWin 
      ? `أبدعت وتألقت يا ${playerName}! أنهيت الجولة بنجاح باهر!` 
      : `لا بأس يا ${playerName}، البطل يتعلم من المحاولات وسوف تفوز في المرة القادمة!`;

    document.getElementById('final-score').innerText = score;
    nextBtn.style.display = isWin ? "inline-block" : "none";
    endScreen.classList.remove('hidden');
  }

  function getShareText() {
    return encodeURIComponent(`لقد حقق البطل (${playerName}) ${score} نقطة في لعبة الذكاء والبالونات الطائرة! 🎈🏆 هل تستطيع تحديه؟`);
  }

  function shareWhatsApp() {
    window.open(`https://api.whatsapp.com/send?text=${getShareText()}`, '_blank');
  }

  function shareFacebook() {
